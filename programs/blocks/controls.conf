# Blocks' actions (devplan/controls.md §7c): what it can do, with each one's default keys and pad
# controls. The user's changes are kept in $HOME/.config/bmds/controls/blocks.conf.

[Controls]
Sets=title;play;paused

[Action left]
Id=1
Label=Move left
Group=Movement
Sets=play
Keys=Left
Pad=Pad.Left;Pad.LeftX-

[Action right]
Id=2
Label=Move right
Group=Movement
Sets=play
Keys=Right
Pad=Pad.Right;Pad.LeftX+

[Action drop]
Id=3
Label=Drop
Group=Movement
Sets=play
Keys=Down;Space
Pad=Pad.Down

[Action turn-left]
Id=4
Label=Turn left
Group=Movement
Sets=play
Keys=Z;Ctrl
Pad=Pad.South;Pad.West;Pad.L1

[Action turn-right]
Id=5
Label=Turn right
Group=Movement
Sets=play
Keys=Up;X
Pad=Pad.East;Pad.North;Pad.R1

[Action hold]
Id=6
Label=Hold
Group=Movement
Sets=play
Keys=C;Shift
Pad=Pad.Up

[Action pause]
Id=7
Label=Pause
Group=Game
Sets=play
Keys=Escape;P
Pad=Pad.Start

[Action resume]
Id=8
Label=Play on
Group=Game
Sets=paused
Keys=Escape;P;Enter
Pad=Pad.Start

[Action give-up]
Id=9
Label=Give up
Group=Game
Sets=paused
Keys=Q
Pad=Pad.Select

[Action play]
Id=10
Label=Play
Group=Game
Sets=title
Keys=Enter;KeypadEnter;Space
Pad=Pad.Start;Pad.South

[Action quit]
Id=11
Label=Quit
Group=Game
Sets=title
Keys=Q;Escape

[Action music]
Id=12
Label=Music on or off
Group=Game
Keys=M
