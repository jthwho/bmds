# Doom's actions (devplan/controls.md §7c): its platform layer turns each into the key Doom's own
# configuration binds to it, so both work. The user's changes are kept in
# $HOME/.config/bmds/controls/doom.conf. Keys not here (letters, digits, F keys, Alt) reach Doom
# as they are: save names, the weapons' numbers, cheats.

[Controls]
Sets=game;menu

[Action forward]
Id=1
Label=Forward
Group=Movement
Sets=game
Keys=Up
Pad=Pad.Up;Pad.LeftY-

[Action backward]
Id=2
Label=Backward
Group=Movement
Sets=game
Keys=Down
Pad=Pad.Down;Pad.LeftY+

[Action turn-left]
Id=3
Label=Turn left
Group=Movement
Sets=game
Keys=Left
Pad=Pad.Left;Pad.LeftX-

[Action turn-right]
Id=4
Label=Turn right
Group=Movement
Sets=game
Keys=Right
Pad=Pad.Right;Pad.LeftX+

[Action strafe-left]
Id=5
Label=Strafe left
Group=Movement
Sets=game
Keys=Comma
Pad=Pad.RightX-

[Action strafe-right]
Id=6
Label=Strafe right
Group=Movement
Sets=game
Keys=Period
Pad=Pad.RightX+

[Action run]
Id=7
Label=Run
Group=Movement
Sets=game
Keys=Shift
Pad=Pad.West

[Action fire]
Id=8
Label=Fire
Group=Weapons
Sets=game
Keys=Ctrl
Pad=Pad.South;Pad.R2

[Action use]
Id=9
Label=Use (open, press)
Group=Movement
Sets=game
Keys=Space
Pad=Pad.East

[Action previous-weapon]
Id=10
Label=Previous weapon
Group=Weapons
Sets=game
Keys=LeftBracket
Pad=Pad.L1

[Action next-weapon]
Id=11
Label=Next weapon
Group=Weapons
Sets=game
Keys=RightBracket
Pad=Pad.North;Pad.R1

[Action map]
Id=12
Label=Map
Group=Game
Sets=game
Keys=Tab
Pad=Pad.Select

[Action menu]
Id=13
Label=Menu
Group=Game
Keys=Escape
Pad=Pad.Start

[Action menu-up]
Id=20
Label=Menu up
Group=Menus
Sets=menu
Keys=Up
Pad=Pad.Up;Pad.LeftY-
Repeat=true

[Action menu-down]
Id=21
Label=Menu down
Group=Menus
Sets=menu
Keys=Down
Pad=Pad.Down;Pad.LeftY+
Repeat=true

[Action menu-left]
Id=22
Label=Menu left (less)
Group=Menus
Sets=menu
Keys=Left
Pad=Pad.Left;Pad.LeftX-
Repeat=true

[Action menu-right]
Id=23
Label=Menu right (more)
Group=Menus
Sets=menu
Keys=Right
Pad=Pad.Right;Pad.LeftX+
Repeat=true

[Action menu-accept]
Id=24
Label=Choose
Group=Menus
Sets=menu
Keys=Enter;KeypadEnter
Pad=Pad.South

[Action menu-back]
Id=25
Label=Back
Group=Menus
Sets=menu
Keys=Backspace
Pad=Pad.East
