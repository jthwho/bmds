# The GUI classes' lock (devplan/guiprograms.md §10): every line must stay as it is (userspace ABI:
# append only). A line the schema has that the lock doesn't is new ABI: append it here.
# Step 1 and 2a (2026-10-22): the first classes.
class Widget : None Abstract
property Widget.enabled Bool RW
property Widget.visible Bool RW
method Widget.setFocus() -> None
class Window : None Concrete
property Window.title String RW
property Window.width Int RW
property Window.height Int RW
method Window.show() -> None
method Window.close() -> None
event Window.closed() on
class Box : Widget Concrete
property Box.direction Atom RW
values Box.direction across down
property Box.spacing Int WO
property Box.margin Int WO
class Label : Widget Concrete
property Label.text String RW
class Button : Widget Concrete
property Button.text String RW
method Button.click() -> None
event Button.clicked() on
class LineEdit : Widget Concrete
property LineEdit.text String RW
property LineEdit.masked Bool WO
property LineEdit.maxLength Int WO
method LineEdit.selectAll() -> None
event LineEdit.accepted(String) on
event LineEdit.edited(String) off

