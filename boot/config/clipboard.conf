# /boot/config/clipboard.conf: the clipboard's conversions (devplan/clipboard.md).
#
# Read at boot. [Convert] lists programs that convert one type to another, a
# filter from stdin to stdout each, as FROM>TO=COMMAND [ARG...]; they are used
# before the built-in conversions (text from a URI list, from ASCII and
# Latin-1, and to ASCII). The most the clipboard keeps is the system
# configuration's clipboard/limit (sysconf).

[Convert]
# text/html>text/plain;charset=utf-8=html2text
