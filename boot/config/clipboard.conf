# /boot/config/clipboard.conf: the clipboard (devplan/clipboard.md).
#
# Read at boot. [Limits] Bytes is the most the clipboard keeps, every
# selection together (1 MiB unless set). [Convert] lists programs that
# convert one type to another, a filter from stdin to stdout each, as
# FROM>TO=COMMAND [ARG...]; they are used before the built-in conversions
# (text from a URI list, from ASCII and Latin-1, and to ASCII).

[Limits]
Bytes=1048576

[Convert]
# text/html>text/plain;charset=utf-8=html2text
