# /boot/config/wm.conf: the window manager's settings (devplan/gui.md §4o).
#
# [Menu] is the menu a right click on the desktop opens where no program
# covers it with its own (the panel does, with its launcher's menu): a line
# an item, Label=command, in order (10 at most). A command is run as a
# Desktop Entry's Exec: found on PATH, its arguments split as a shell would.

[Menu]
Terminal=terminal

[Keys]
# Ctrl+Shift+Windows (held together) runs this: a terminal even without the panel.
Terminal=terminal
