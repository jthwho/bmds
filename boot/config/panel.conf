# /boot/config/panel.conf: the panel's layout (devplan/gui.md §4c).
#
# [Panel] Items lists the items left to right: each a section below, whose
# Type is its kind (by default its name): launcher, windows, clock, spacer.
# Edge is top or bottom. IconTheme is a theme in /sd0/p0/share/icons:
# flat-color (the default) or glyphs; icons a theme lacks come from flat-color.

[Panel]
Edge=top
Items=launcher;windows;clock
IconTheme=flat-color

[Launcher]
Label=Apps
# Where the launcher's entries (NAME.desktop files) are: the first file of
# a name wins, so one here replaces a package's (Hidden=true hides it).
Applications=/boot/applications;/sd0/p0/share/applications
# Past this many entries, the menu has a submenu per category.
Submenus=12

[Windows]
# The widest a window's button gets, in pixels.
MaxWidth=200

[Clock]
# As date(1)'s formats; Zone= shows another zone (a name or POSIX rules).
Format=%a %d %b %H:%M

[Desktop]
# The launcher's menu on a right click on the desktop.
Menu=true
# Where the desktop's icons are, ';'-separated; empty: none. NAME.desktop files
# are launchers; other files show with their type's icon (hidden ones, named
# with a leading '.', don't). A double click starts a launcher, and opens a file
# with the application MimeApps names for its type (freedesktop.org's format).
Icons=/boot/desktop
MimeApps=/boot/config/mimeapps.list
