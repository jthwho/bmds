# /boot/config/terminal.conf: the terminal's colors (devplan/gui.md §4l).
#
# Read by each terminal as it starts. Colors are RRGGBB (or #RRGGBB). Text,
# Background and Cursor are the defaults; Color0 to Color15 the 16 ANSI
# colors programs choose from (black, red, green, yellow, blue, magenta, cyan,
# white, then their bright ones), xterm's unless set here. 'win color
# terminal-text RRGGBB' (and terminal-background, terminal-cursor) changes
# every open terminal until the window system stops.

[Colors]
Text=c0c0c0
Background=000000
Cursor=c0c0c0
